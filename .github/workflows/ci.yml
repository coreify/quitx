name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run test:cli
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  platform-guard:
    name: Platform Guard (Ubuntu)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Setup dependency stubs for ESM resolution
        run: |
          mkdir -p node_modules/@clack/core node_modules/@clack/prompts node_modules/execa
          echo 'export class MultiSelectPrompt {};' > node_modules/@clack/core/index.js
          echo '{"name":"@clack/core","type":"module","main":"./index.js"}' > node_modules/@clack/core/package.json
          echo 'export const isCancel = () => false, spinner = () => ({ start: () => {}, stop: () => {} }), log = { success: () => {}, error: () => {}, warn: () => {} }, intro = () => {}, outro = () => {}, confirm = async () => false, cancel = () => {}, multiselect = async () => [], select = async () => null;' > node_modules/@clack/prompts/index.js
          echo '{"name":"@clack/prompts","type":"module","main":"./index.js"}' > node_modules/@clack/prompts/package.json
          echo 'export const execa = async () => ({ stdout: "" });' > node_modules/execa/index.js
          echo '{"name":"execa","type":"module","main":"./index.js"}' > node_modules/execa/package.json
      - name: Verify non-macOS rejection
        run: |
          OUTPUT=$(node dist/cli.js 2>&1 || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "quitx only works on macOS"
